[project]
name = "tmesim"
version = "0.1.0"
description = "Stage 0 kill-test: patient-specific glioblastoma microenvironment reconstruction, drug-transport simulation, and validation against a cheap baseline."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scikit-image",
    "networkx",
    "scikit-learn",
    "requests",
    "tifffile",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tmesim*"]
