[project]
name = "tmesim"
version = "0.1.0"
description = "Stage 0 kill-test: patient-specific glioblastoma microenvironment reconstruction, drug-transport simulation, and validation against a cheap baseline."
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "scikit-image",
    "networkx",
    "scikit-learn",
    "requests",
    "tifffile",
    "imagecodecs",  # tifffile's LZW/JPEG2000/etc decoders; required to read
                    # real OME-TIFF CODEX exports (data.adapters.codex) - the
                    # Greenwald/Tirosh 2024 files are LZW-compressed and raise
                    # without this at decode time, not at import time.
]

[project.scripts]
# `pip install -e .` registers this as a real command, e.g.:
#   vivum reconstruct --source xenium --dx 12
#   vivum compare-drugs --drugs temozolomide,cisplatin,doxorubicin
#   vivum studio
# Equivalent to `python -m tmesim.cli ...` (tmesim/cli.py); see that module's
# docstring and docs/QUICKSTART.md for the full command list.
vivum = "tmesim.cli:main"

[project.optional-dependencies]
# The local tmesim Studio application (app/server/ + app/web/). Additive: the
# simulation engine, the CLI experiments and the rest of the test suite do not
# import any of these, so a checkout without the extra behaves exactly as before
# and tests/test_app_server.py skips itself.
#   ./.venv/bin/python -m pip install -e '.[app]'
#   ./.venv/bin/python -m app.server
app = [
    "fastapi",
    "uvicorn",
    "httpx",   # required by starlette's TestClient (tests/test_app_server.py)
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tmesim*"]
