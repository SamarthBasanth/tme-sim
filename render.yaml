# Render Blueprint — the hosted deploy of the Vivum Studio image, as code.
#
# WHAT THIS FILE IS FOR. Everything in it was otherwise a thing an operator had
# to remember in a dashboard, and the two that matter most fail SILENTLY when
# forgotten: a health check pointed at a route that needs an API key marks a
# healthy container down, and an unset grid ceiling lets one ordinary request
# OOM-kill a small instance. Both are settled here instead.
#
# Apply it: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file from the repo root. Nothing here is applied by pushing alone; a
# Blueprint is created once, by hand. See docs/RUNBOOK_DEPLOY.md §H.
#
# IT PUSHES NOTHING AND CONTAINS NO SECRET. The one secret this service needs is
# generated by Render (see TMESIM_STUDIO_API_KEY below) and never appears in a
# commit.
#
# A SERVICE IS LIVE, AND IT MAY NOT BE THIS FILE'S. Corrected 2026-09-20: an
# earlier version of this comment said the repository had no Render account
# attached and that no deploy had been made. Both are now wrong — a push to
# main deployed commit c5be901 to https://vivum.onrender.com, verified by
# fetching it (/ served the workspace, /studio the Studio, /index.html the
# Studio, /api/workspace 401).
#
# But a repo-linked service and a Blueprint-managed one are DIFFERENT THINGS,
# and from here they look identical. If the live service was created by hand
# from the dashboard, it auto-deploys on push and IGNORES THIS FILE ENTIRELY —
# the disk and TMESIM_STATE_DIR below would not exist on it, and projects
# would still be destroyed on every deploy while this file says otherwise.
# Checking takes one look: dashboard → vivum-studio → Settings. A Blueprint
# service says so; a manual one has no Blueprint link. See
# docs/RUNBOOK_DEPLOY.md §H1.
#
# The keys have been checked against Render's Blueprint specification and are
# current (`runtime:` replaces the deprecated `env:`; `autoDeployTrigger:`
# replaces the deprecated `autoDeploy:`). The IMAGE has been built and
# exercised — see docs/RUNBOOK_DEPLOY.md §H0 for which facts are measured and
# which are still open.

services:
  - type: web
    name: vivum-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /healthz, NOT /api/health, and this is the single most expensive line in
    # the file to get wrong. Every /api/ route is behind the X-API-Key gate; a
    # platform health checker cannot carry a header. Pointed at /api/health a
    # check got 401 forever, concluded the service never came up, and killed a
    # container that was serving correctly — twice, in this project's history.
    # /healthz is exempt from the gate by design and returns a literal
    # {"ok": true} and nothing else, so exempting it leaks nothing.
    #
    # It answers GET and HEAD. Both were measured in a built container on
    # 2026-09-20 (HEAD returned 404 until app/server/api.py registered it with
    # @app.api_route(..., methods=["GET", "HEAD"]), while the gate had already
    # been written to expect HEAD probes — a health check that used HEAD would
    # have marked this service down while it served perfectly).
    healthCheckPath: /healthz

    # Every commit to the linked branch deploys. Valid alternatives are
    # `checksPass` (deploy only when the branch's CI is green — the docker and
    # product workflows in .github/workflows/) and `off` (deploy by hand only).
    # `checksPass` is the better setting once this service carries anything a
    # person depends on; `commit` is the right one while the product is being
    # built, because a deploy is how you find out.
    autoDeployTrigger: commit

    envVars:
      # THE API KEY, GENERATED BY THE PLATFORM RATHER THAN BY THE PROCESS.
      #
      # This is not a convenience. The image's CMD binds 0.0.0.0, which
      # app/server/__main__.py treats as non-loopback: with no key set it
      # auto-generates one and PRINTS IT EXACTLY ONCE to stdout, persisting it
      # nowhere. On a platform whose logs roll, that key is then gone and the
      # service is unusable by anyone — including the person who deployed it.
      #
      # `generateValue: true` makes Render mint a random 256-bit value at
      # Blueprint creation and keep it in the service's environment, where it
      # can be read (and rotated) in the dashboard. The server then reports
      # `[set via TMESIM_STUDIO_API_KEY]` in its banner instead of
      # `[generated (not persisted -- save it now)]`.
      #
      # Read it: dashboard -> this service -> Environment. Every /api/ request
      # needs it as `X-API-Key`. The static pages and /healthz do not, which is
      # deliberate: the page must load in order to prompt for the key.
      #
      # READ docs/DEPLOYMENT.md §2 BEFORE HANDING THIS KEY TO ANYONE. It
      # authenticates POST /api/sections/scan; it does not CONFINE it. The key
      # is closer to read access as the server's uid than to a password — which
      # is why the image runs as uid 10001 and why the line below confines the
      # scanner to the tissue directory.
      # OPEN INSTANCE, FOR NOW. The product owner asked for a demo anyone
      # can open: landing page straight into the simulator, no credential.
      #
      # Both lines are needed and the pair is the point. Removing the key
      # alone is NOT enough — app/server/__main__.py invents one on any
      # non-loopback bind and prints it once, so the instance would still be
      # gated by a secret nobody saved. TMESIM_STUDIO_OPEN is what suppresses
      # that invention, and it is deliberately explicit: the default protects
      # every other deployment and does not move.
      #
      # If a key is ever set again, THE KEY WINS and this flag is ignored with
      # a banner line, so re-closing the instance is one dashboard change and
      # cannot be half-done.
      #
      # docs/DEPLOYMENT.md sec.4 states what this opens: submitting runs, and
      # creating and DELETING projects, by anyone with the URL. The scan and
      # browse confinement, the request cap, the grid ceiling and the memory
      # refusals all stay on — they keep the process alive rather than decide
      # who is asking.
      - key: TMESIM_STUDIO_OPEN
        value: "1"

      # - key: TMESIM_STUDIO_API_KEY
      #   generateValue: true
      #
      # Commented out rather than deleted so re-closing the instance is
      # uncommenting one block. Note Render does not remove a variable that is
      # already set on the service when it disappears from this file — if this
      # service has TMESIM_STUDIO_API_KEY in its dashboard, it must be deleted
      # there too or the gate stays on.

      # WHAT MAKES THE DISK BELOW ACTUALLY HOLD ANYTHING.
      #
      # Unset, the server writes runs/ projects/ reports/ under /app/app, in
      # the container filesystem, which is discarded on every deploy. Set, all
      # three become children of ONE directory -- which is the point, because
      # Render allows one disk per service and the stores were previously
      # siblings under /app/app, a directory that also holds server/ and web/
      # and therefore cannot be mounted over without hiding the application.
      #
      # The path is not arbitrary: the image pre-creates /var/lib/vivum owned
      # by uid 10001 so the mounted volume inherits that ownership. Point this
      # somewhere else and the mount is root-owned, the server cannot create
      # its stores, and it will REFUSE TO START with a sentence naming the uid
      # and the owner (app/server/cache.py::state_dir_problem). That refusal is
      # deliberate: a silent fallback to the ephemeral default would tell the
      # operator persistence was working while every redeploy destroyed it.
      - key: TMESIM_STATE_DIR
        value: /var/lib/vivum

      # Not set here, ON PURPOSE, and each omission is a decision:
      #
      #   TMESIM_MAX_GRID_CELLS — the image already sets `auto` (see the
      #     Dockerfile's ENV and its measurements). Repeating the value here
      #     would create a second place for it to drift. Override it in the
      #     dashboard if you want an explicit integer; a dashboard value beats
      #     an image ENV.
      #
      #   TMESIM_STUDIO_DATA_ROOTS — app/server/__main__.py confines the
      #     scanner to <repo>/data_cache automatically on a non-loopback bind,
      #     which is what this service is. Setting it here could only WIDEN
      #     that. Widen it only if you deliberately mount tissue elsewhere.
      #
      #   PORT — Render assigns it (default 10000) and the image honours it:
      #     the CMD passes no --port, and argparse defaults --port from $PORT.
      #     MEASURED 2026-09-20: `docker run -e PORT=10000` served on 10000 and
      #     /healthz answered 200 there. Do not add a --port flag to the CMD;
      #     it would override the platform and nothing would listen where the
      #     platform routes.
      #
      #   PYTHONUNBUFFERED — set in the image, because a block-buffered stdout
      #     hides the startup banner behind uvicorn's logs.

    # THE DISK. Without it, everything above is a demo that forgets.
    #
    # This block replaces a comment that said a disk could not work here, and
    # the reason it said so was true when it was written: cache.py::runs_dir
    # and projects.py::projects_dir both built from repo_root() with no
    # environment override, so the two directories holding user work were
    # siblings under /app/app and no single mount could cover both without
    # burying the application's own code. TMESIM_STATE_DIR removed that
    # constraint on 2026-09-20 and this file went on describing the old world
    # -- a document understating what the code could do, which is the same
    # drift as overstating it and is read with the same trust.
    #
    # sizeGB 10 is a starting point, not a measurement: it is the smallest
    # size worth provisioning for a store whose per-run payload has not been
    # profiled at scale here. Render can grow a disk and cannot shrink one.
    #
    # WHAT IS MEASURED AND WHAT IS NOT. Measured 2026-09-20 in a built
    # container, under --memory=512m, on a volume mounted at the path below:
    # the mount inherited uid 10001, runs/ projects/ reports/ were created
    # 0700, /healthz answered 200, and a project created through the API
    # survived the container being destroyed and replaced with its created_at
    # byte-identical. That was Docker's volume semantics. RENDER'S OWN DISK
    # OWNERSHIP IS NOT VERIFIED FROM HERE -- no Render account is attached to
    # this repository. If Render mounts disks root-owned regardless of the
    # image, this service will refuse to start and say so in one line; see
    # docs/RUNBOOK_DEPLOY.md H7 for the two-command check and the fix.
    disk:
      name: vivum-state
      mountPath: /var/lib/vivum
      sizeGB: 10
