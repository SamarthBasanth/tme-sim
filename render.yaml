# Render Blueprint — the hosted deploy of the Vivum Studio image, as code.
#
# WHAT THIS FILE IS FOR. Everything in it was otherwise a thing an operator had
# to remember in a dashboard, and the two that matter most fail SILENTLY when
# forgotten: a health check pointed at a route that needs an API key marks a
# healthy container down, and an unset grid ceiling lets one ordinary request
# OOM-kill a small instance. Both are settled here instead.
#
# Apply it: Render dashboard -> New -> Blueprint -> pick this repo. Render reads
# this file from the repo root. Nothing here is applied by pushing alone; a
# Blueprint is created once, by hand. See docs/RUNBOOK_DEPLOY.md §H.
#
# IT PUSHES NOTHING AND CONTAINS NO SECRET. The one secret this service needs is
# generated by Render (see TMESIM_STUDIO_API_KEY below) and never appears in a
# commit.
#
# NOT VERIFIED FROM HERE. This file has been checked against Render's Blueprint
# specification and its keys are current (`runtime:` replaces the deprecated
# `env:`; `autoDeployTrigger:` replaces the deprecated `autoDeploy:`), but the
# repository has no Render account attached to it, so no deploy has been made
# from it. The IMAGE it deploys has been built and exercised — see
# docs/RUNBOOK_DEPLOY.md §H0 for exactly which facts are measured and which are
# still open.

services:
  - type: web
    name: vivum-studio
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # /healthz, NOT /api/health, and this is the single most expensive line in
    # the file to get wrong. Every /api/ route is behind the X-API-Key gate; a
    # platform health checker cannot carry a header. Pointed at /api/health a
    # check got 401 forever, concluded the service never came up, and killed a
    # container that was serving correctly — twice, in this project's history.
    # /healthz is exempt from the gate by design and returns a literal
    # {"ok": true} and nothing else, so exempting it leaks nothing.
    #
    # It answers GET and HEAD. Both were measured in a built container on
    # 2026-09-20 (HEAD returned 404 until app/server/api.py registered it with
    # @app.api_route(..., methods=["GET", "HEAD"]), while the gate had already
    # been written to expect HEAD probes — a health check that used HEAD would
    # have marked this service down while it served perfectly).
    healthCheckPath: /healthz

    # Every commit to the linked branch deploys. Valid alternatives are
    # `checksPass` (deploy only when the branch's CI is green — the docker and
    # product workflows in .github/workflows/) and `off` (deploy by hand only).
    # `checksPass` is the better setting once this service carries anything a
    # person depends on; `commit` is the right one while the product is being
    # built, because a deploy is how you find out.
    autoDeployTrigger: commit

    envVars:
      # THE API KEY, GENERATED BY THE PLATFORM RATHER THAN BY THE PROCESS.
      #
      # This is not a convenience. The image's CMD binds 0.0.0.0, which
      # app/server/__main__.py treats as non-loopback: with no key set it
      # auto-generates one and PRINTS IT EXACTLY ONCE to stdout, persisting it
      # nowhere. On a platform whose logs roll, that key is then gone and the
      # service is unusable by anyone — including the person who deployed it.
      #
      # `generateValue: true` makes Render mint a random 256-bit value at
      # Blueprint creation and keep it in the service's environment, where it
      # can be read (and rotated) in the dashboard. The server then reports
      # `[set via TMESIM_STUDIO_API_KEY]` in its banner instead of
      # `[generated (not persisted -- save it now)]`.
      #
      # Read it: dashboard -> this service -> Environment. Every /api/ request
      # needs it as `X-API-Key`. The static pages and /healthz do not, which is
      # deliberate: the page must load in order to prompt for the key.
      #
      # READ docs/DEPLOYMENT.md §2 BEFORE HANDING THIS KEY TO ANYONE. It
      # authenticates POST /api/sections/scan; it does not CONFINE it. The key
      # is closer to read access as the server's uid than to a password — which
      # is why the image runs as uid 10001 and why the line below confines the
      # scanner to the tissue directory.
      - key: TMESIM_STUDIO_API_KEY
        generateValue: true

      # Not set here, ON PURPOSE, and each omission is a decision:
      #
      #   TMESIM_MAX_GRID_CELLS — the image already sets `auto` (see the
      #     Dockerfile's ENV and its measurements). Repeating the value here
      #     would create a second place for it to drift. Override it in the
      #     dashboard if you want an explicit integer; a dashboard value beats
      #     an image ENV.
      #
      #   TMESIM_STUDIO_DATA_ROOTS — app/server/__main__.py confines the
      #     scanner to <repo>/data_cache automatically on a non-loopback bind,
      #     which is what this service is. Setting it here could only WIDEN
      #     that. Widen it only if you deliberately mount tissue elsewhere.
      #
      #   PORT — Render assigns it (default 10000) and the image honours it:
      #     the CMD passes no --port, and argparse defaults --port from $PORT.
      #     MEASURED 2026-09-20: `docker run -e PORT=10000` served on 10000 and
      #     /healthz answered 200 there. Do not add a --port flag to the CMD;
      #     it would override the platform and nothing would listen where the
      #     platform routes.
      #
      #   PYTHONUNBUFFERED — set in the image, because a block-buffered stdout
      #     hides the startup banner behind uvicorn's logs.

    # NO DISK, AND THIS SERVICE IS THEREFORE EPHEMERAL. Stated here because it
    # is a product-level consequence, not a deployment detail: everything the
    # server writes lands under /app/app (runs, projects, reports, compounds,
    # uploads), a container filesystem is discarded on every deploy and
    # restart, so PROJECTS AND RUN HISTORY DO NOT SURVIVE A REDEPLOY. With
    # `autoDeployTrigger: commit` above, that is every push.
    #
    # A disk does not currently fix it, and the reason is worth knowing before
    # anyone tries. Render allows ONE disk per service, and the two directories
    # that hold work are siblings: /app/app/runs and /app/app/projects. Their
    # common parent, /app/app, also contains `server/` and `web/` — mounting a
    # disk there would hide the application's own code and the front end, and
    # the service would not start. Neither path is configurable:
    # app/server/cache.py::runs_dir and app/server/projects.py::projects_dir
    # both build from repo_root() with no environment override. So a single
    # disk can persist run history OR the project store, not both, and a
    # project whose runs were discarded is a set of dangling ids.
    #
    # Until those two helpers honour an environment variable, treat a hosted
    # instance as a place to DEMONSTRATE the product, not to keep work in. The
    # one-disk half-measure, if you want run payloads to survive:
    #
    # disk:
    #   name: runs
    #   mountPath: /app/app/runs
    #   sizeGB: 10
    #
    # Two things to check the first time, because neither is verified here: the
    # image runs as uid 10001 and a platform-provided volume has to be writable
    # by that uid, and /app/app/projects would still be ephemeral, so the
    # workspace home would come back empty pointing at runs that survived.
